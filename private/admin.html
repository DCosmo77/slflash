<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>Kelola Vocabulary</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="wrap">
<div class="top"><a href="/">← Lihat website</a><button class="btn alt" id="out">Keluar</button></div>
<div class="panel"><b id="ft">Tambah kosakata baru</b>
  <label>Kata (English)</label><input type="text" id="w" placeholder="mis. umbrella">
  <label>Kode QR / ID (huruf kecil, angka, minus). Tidak bisa diubah setelah dibuat.</label><input type="text" id="i">
  <label>IPA (tanpa garis miring)</label><input type="text" id="ipa" placeholder="ʌmˈbrel.ə">
  <label>Arti dalam Bahasa Indonesia (opsional)</label><input type="text" id="m">
  <label>Gambar (JPEG/PNG/WebP, otomatis dikecilkan)</label><input type="file" id="f" accept="image/*">
  <div class="row"><button class="btn" id="ok">Tambah</button><button class="btn alt" id="no" hidden>Batal</button></div></div>
<div class="panel"><b>Daftar kartu</b><div id="list"></div></div>
<div class="panel" id="qrbox" hidden style="text-align:center"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = w => w.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const toast = t => { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3000); };
let cards = [], editId = null;

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.reload(); throw 0; }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { toast(d.error || 'Gagal.'); throw 0; }
  return d;
}
function toJpeg(file) { return new Promise((res, rej) => {
  const im = new Image(), u = URL.createObjectURL(file);
  im.onload = () => { const s = Math.min(1, 800 / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .85)); };
  im.onerror = rej; im.src = u; }); }

async function load() {
  cards = await (await fetch('/api/cards')).json();
  $('#list').innerHTML = cards.length ? cards.map(c => `<div class="item"><div class="thumb">${c.img ? `<img src="${esc(c.img)}" alt="">` : ''}</div>
    <div class="meta"><b>${esc(c.word)}</b><small>/${esc(c.ipa)}/ · /c/${esc(c.id)}</small></div>
    <button class="btn alt" data-qr="${esc(c.id)}">QR</button><button class="btn alt" data-ed="${esc(c.id)}">Ubah</button><button class="btn del" data-del="${esc(c.id)}">Hapus</button></div>`).join('') : '<p>Belum ada kartu.</p>';
}
function reset() { editId = null; ['w','i','ipa','m','f'].forEach(k => $('#' + k).value = ''); $('#i').disabled = false; $('#ft').textContent = 'Tambah kosakata baru'; $('#ok').textContent = 'Tambah'; $('#no').hidden = true; }
$('#w').oninput = e => { if (!editId) $('#i').value = slug(e.target.value); };
$('#no').onclick = reset;
$('#ok').onclick = async () => {
  const word = $('#w').value.trim(), id = slug($('#i').value || word);
  if (!word || !id) return toast('Kata wajib diisi.');
  const body = { id, word, ipa: $('#ipa').value, meaning: $('#m').value };
  const f = $('#f').files[0];
  if (f) { try { body.image = await toJpeg(f); } catch { return toast('Gambar tidak bisa dibaca.'); } }
  try { editId ? await api('PUT', '/api/admin/cards/' + editId, body) : await api('POST', '/api/admin/cards', body); } catch { return; }
  toast('Tersimpan.'); reset(); load();
};
$('#list').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.ed) { const c = cards.find(x => x.id === b.dataset.ed); editId = c.id;
    $('#w').value = c.word; $('#i').value = c.id; $('#i').disabled = true; $('#ipa').value = c.ipa; $('#m').value = c.meaning;
    $('#ft').textContent = 'Ubah kartu'; $('#ok').textContent = 'Simpan'; $('#no').hidden = false; scrollTo(0, 0); }
  if (b.dataset.del && confirm('Hapus kartu ini?')) { try { await api('DELETE', '/api/admin/cards/' + b.dataset.del); } catch { return; } load(); }
  if (b.dataset.qr) { const id = b.dataset.qr, box = $('#qrbox'); box.hidden = false;
    box.innerHTML = `<b>QR untuk “${esc(id)}”</b><div style="margin:12px 0"><img src="/api/admin/qr/${esc(id)}" width="260" height="260" alt="QR"></div><a class="btn" href="/api/admin/qr/${esc(id)}" download="qr-${esc(id)}.png" style="text-decoration:none;display:inline-block">Unduh PNG</a>`;
    box.scrollIntoView({ behavior: 'smooth' }); }
};
$('#out').onclick = async () => { await fetch('/admin/logout', { method: 'POST' }); location.reload(); };
load();
</script></body></html>
